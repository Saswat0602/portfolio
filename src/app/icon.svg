<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="srBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="srText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="15" fill="#030712"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13" fill="url(#srBg)" stroke="url(#srBorder)" stroke-width="2.5"/>

  <!-- Tech Accent Spark in top right -->
  <circle cx="50" cy="14" r="3" fill="#38bdf8"/>

  <!-- SR Monogram -->
  <text 
    x="31" 
    y="43" 
    font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="-1.5" 
    fill="url(#srText)" 
    text-anchor="middle"
  >SR</text>
</svg>
